<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D6FE8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100" height="100" rx="26" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="96" height="96" rx="24" fill="none" stroke="#23354D" stroke-width="2"/>
  <rect x="3" y="3" width="94" height="94" rx="23" fill="none" stroke="#1D6FE8" stroke-width="1.5" stroke-opacity="0.5"/>
  <circle cx="50" cy="50" r="32" fill="#111C2B" stroke="#1D6FE8" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="50" y="58" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">IH</text>
  <circle cx="50" cy="18" r="3" fill="#1D6FE8" filter="url(#glow)"/>
</svg>

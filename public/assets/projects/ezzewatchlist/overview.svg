<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="wlBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="wlCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2B"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#wlBg)"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="880" height="46" rx="12" fill="#111C2B" stroke="#23354D" stroke-width="1.5"/>
  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">EZZEWATCHLIST — MOVIE &amp; SERIES TRACKER</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">APPLICATION ARCHITECTURE MOCKUP</text>

  <!-- Left: Watchlist Interface Mockup -->
  <g transform="translate(40, 100)">
    <rect width="450" height="340" rx="16" fill="url(#wlCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="20" y="20" width="410" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5F9FF">TABBED MEDIA LIBRARY &amp; RUNTIME ANALYTICS</text>

    <!-- Tab navigation -->
    <g transform="translate(20, 70)">
      <rect width="125" height="28" rx="6" fill="#1D6FE8"/>
      <text x="62" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Watching (4)</text>

      <rect x="135" width="125" height="28" rx="6" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="197" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="middle">Watched (32)</text>

      <rect x="270" width="125" height="28" rx="6" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="332" y="18" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="middle">Planned (18)</text>
    </g>

    <!-- Poster grid cards -->
    <g transform="translate(20, 115)">
      <rect width="90" height="135" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <rect x="6" y="6" width="78" height="90" rx="4" fill="#162438"/>
      <rect x="6" y="104" width="60" height="8" rx="2" fill="#1D6FE8"/>
      <rect x="6" y="118" width="40" height="6" rx="2" fill="#9AAEC4"/>

      <rect x="105" width="90" height="135" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <rect x="111" y="6" width="78" height="90" rx="4" fill="#162438"/>
      <rect x="111" y="104" width="70" height="8" rx="2" fill="#1D6FE8"/>
      <rect x="111" y="118" width="50" height="6" rx="2" fill="#9AAEC4"/>

      <rect x="210" width="90" height="135" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <rect x="216" y="6" width="78" height="90" rx="4" fill="#162438"/>
      <rect x="216" y="104" width="55" height="8" rx="2" fill="#1D6FE8"/>
      <rect x="216" y="118" width="35" height="6" rx="2" fill="#9AAEC4"/>

      <rect x="315" width="90" height="135" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <rect x="321" y="6" width="78" height="90" rx="4" fill="#162438"/>
      <rect x="321" y="104" width="65" height="8" rx="2" fill="#1D6FE8"/>
      <rect x="321" y="118" width="45" height="6" rx="2" fill="#9AAEC4"/>
    </g>

    <!-- Runtime statistics pill -->
    <g transform="translate(20, 270)">
      <rect width="410" height="48" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="20" font-family="system-ui, sans-serif" font-size="10" fill="#9AAEC4">Total Runtime Tracked: 148 hrs • Average Rating: 8.6/10</text>
      <text x="16" y="36" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Top Genres: Sci-Fi, Thriller, Tech Drama</text>
    </g>
  </g>

  <!-- Right: Architecture Features -->
  <g transform="translate(510, 100)">
    <rect width="410" height="340" rx="16" fill="url(#wlCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="20" y="20" width="370" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D6FE8">TECHNICAL MODULES</text>

    <g transform="translate(20, 75)">
      <rect width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Local SQLite Database (`sqflite`)</text>
      <text x="16" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Relational on-device schema with fast query indexing</text>

      <rect y="58" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Provider State Architecture</text>
      <text x="16" y="96" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">ChangeNotifier reactivity, theme provider, and clean MVC/MVVM</text>

      <rect y="116" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Hero Animations &amp; Custom Posters</text>
      <text x="16" y="154" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Image picker, cached network images, and fluid page transitions</text>

      <rect y="174" width="370" height="58" rx="10" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="16" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Planned Supabase Cloud Synchronization</text>
      <text x="16" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Roadmap architecture for two-way sync (SQLite ↔ Supabase Cloud)</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 465)">
    <rect width="880" height="45" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4">
      Core Tech: <tspan fill="#F5F9FF">Flutter • Dart • SQLite • Provider • Image Picker • SharedPreferences • Statistics Engine</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="scBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="scCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2B"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#scBg)"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="880" height="46" rx="12" fill="#111C2B" stroke="#23354D" stroke-width="1.5"/>
  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">SHEC CSE — DEPARTMENTAL ACADEMIC &amp; COMMUNITY PLATFORM</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">CAMPUS ARCHITECTURE MOCKUP</text>

  <!-- Left: Department Portal Visualizer -->
  <g transform="translate(40, 100)">
    <rect width="450" height="340" rx="16" fill="url(#scCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="20" y="20" width="410" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5F9FF">ACADEMIC NOTICEBOARD &amp; MILESTONE TRACKER</text>

    <!-- Notices & Syllabus Cards -->
    <g transform="translate(20, 75)">
      <rect width="410" height="68" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <rect x="16" y="14" width="70" height="18" rx="4" fill="#1D6FE8"/>
      <text x="22" y="27" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">OFFICIAL NOTICE</text>
      <text x="96" y="28" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Semester Examination Routine Published</text>
      <text x="16" y="52" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Cloud-synchronized schedule archive for CSE 2020-2021 batch</text>

      <rect y="78" width="410" height="68" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <rect x="16" y="92" width="80" height="18" rx="4" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="22" y="105" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#60A5FA">ACADEMIC PATH</text>
      <text x="106" y="106" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">CSE Syllabus &amp; Lab Guidelines Matrix</text>
      <text x="16" y="130" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Coursework structure, credits, prerequisites, and faculty contacts</text>

      <rect y="156" width="410" height="68" rx="10" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <rect x="16" y="170" width="75" height="18" rx="4" fill="#2F2E98"/>
      <text x="22" y="183" font-family="system-ui, sans-serif" font-size="9" font-weight="700" fill="#FFFFFF">CAREER HUB</text>
      <text x="101" y="184" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Software Engineering &amp; Internship Pathways</text>
      <text x="16" y="208" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Curated roadmaps for Flutter, backend engineering, and competitive coding</text>
    </g>
  </g>

  <!-- Right: Architecture Features -->
  <g transform="translate(510, 100)">
    <rect width="410" height="340" rx="16" fill="url(#scCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="20" y="20" width="370" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D6FE8">CAMPUS SYSTEM CAPABILITIES</text>

    <g transform="translate(20, 75)">
      <rect width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Departmental Academic Tracking</text>
      <text x="16" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Unified semester progress, credit monitoring, and exam timetables</text>

      <rect y="58" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Direct Student &amp; Campus Messaging</text>
      <text x="16" y="96" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Realtime communication for student announcements &amp; events</text>

      <rect y="116" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Cloud &amp; Local Storage Sync</text>
      <text x="16" y="154" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Supabase database with offline caching for low-bandwidth connectivity</text>

      <rect y="174" width="370" height="58" rx="10" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="16" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Image Processing &amp; Lightweight Notices</text>
      <text x="16" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Automatic image optimization for fast notice viewing on mobile devices</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 465)">
    <rect width="880" height="45" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4">
      Core Tech: <tspan fill="#F5F9FF">Flutter • Dart • Supabase • PostgreSQL • Realtime • Cloud Storage • Image Processing</tspan>
    </text>
  </g>
</svg>

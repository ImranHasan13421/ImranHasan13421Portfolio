  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">EZZECV — OFFLINE CV BUILDER &amp; LIVE PDF GENERATION</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">BUILDER ARCHITECTURE MOCKUP</text>


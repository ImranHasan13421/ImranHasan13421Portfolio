      <text x="16" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Carefully structured typography for Applicant Tracking Systems</text>

      <rect y="58" width="380" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>

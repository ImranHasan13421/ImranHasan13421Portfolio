  <g transform="translate(40, 100)">
    <rect width="440" height="340" rx="16" fill="url(#ecCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="20" y="20" width="400" height="36" rx="8" fill="#162438"/>

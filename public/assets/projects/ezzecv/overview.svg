      <rect x="20" y="38" width="140" height="7" rx="2" fill="#9AAEC4" fill-opacity="0.5"/>
      <line x1="20" y1="55" x2="280" y2="55" stroke="#23354D" stroke-width="1"/>

      <!-- Sections inside doc -->
      <g transform="translate(20, 68)">
        <rect width="60" height="8" rx="2" fill="#3B82F6"/>
        <rect y="14" width="260" height="5" rx="2" fill="#23354D"/>
        <rect y="24" width="220" height="5" rx="2" fill="#23354D"/>
        <rect y="34" width="240" height="5" rx="2" fill="#23354D"/>

        <rect y="52" width="70" height="8" rx="2" fill="#3B82F6"/>
        <rect y="66" width="260" height="5" rx="2" fill="#23354D"/>
        <rect y="76" width="200" height="5" rx="2" fill="#23354D"/>

        <rect y="94" width="55" height="8" rx="2" fill="#3B82F6"/>
        <rect y="108" width="260" height="5" rx="2" fill="#23354D"/>
        <rect y="118" width="180" height="5" rx="2" fill="#23354D"/>
      </g>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="atBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#070D18"/>
    </linearGradient>
    <linearGradient id="atCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2B"/>
      <stop offset="100%" stop-color="#0B1422"/>
    </linearGradient>
    <pattern id="atGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23354D" stroke-width="0.6" stroke-opacity="0.25"/>
    </pattern>
  </defs>

  <rect width="960" height="540" fill="url(#atBg)"/>
  <rect width="960" height="540" fill="url(#atGrid)"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="880" height="46" rx="12" fill="#111C2B" stroke="#23354D" stroke-width="1.5"/>
  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">ATLANTA — AI PERSONAL ASSISTANT &amp; COMMAND HUB</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">CYBER-TECH ARCHITECTURE MOCKUP</text>

  <!-- Left: Telemetry HUD Terminal Visualizer -->
  <g transform="translate(40, 100)">
    <rect width="460" height="340" rx="16" fill="url(#atCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="20" y="20" width="420" height="36" rx="8" fill="#162438"/>
    <circle cx="36" cy="38" r="4" fill="#1D6FE8"/>
    <text x="50" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5F9FF">VOICE HUD TELEMETRY &amp; REALTIME WAVEFORM</text>

    <!-- Radar / Circle visualizer -->
    <g transform="translate(130, 80)">
      <circle cx="100" cy="100" r="85" fill="none" stroke="#23354D" stroke-width="1.5"/>
      <circle cx="100" cy="100" r="60" fill="none" stroke="#1D6FE8" stroke-width="1.5" stroke-dasharray="6 4"/>
      <circle cx="100" cy="100" r="35" fill="#0B1220" stroke="#3B82F6" stroke-width="2"/>
      <text x="100" y="105" font-family="system-ui, sans-serif" font-size="13" font-weight="800" fill="#60A5FA" text-anchor="middle">ATLANTA</text>
      <circle cx="100" cy="40" r="4" fill="#3B82F6"/>
      <circle cx="152" cy="130" r="3" fill="#60A5FA"/>
      <circle cx="55" cy="120" r="3" fill="#1D6FE8"/>
    </g>

    <!-- Audio waveform -->
    <g transform="translate(40, 290)">
      <rect width="380" height="32" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <path d="M 20 16 Q 40 4, 60 16 T 100 16 T 140 16 T 180 6 T 220 26 T 260 16 T 300 16 T 340 16 T 360 16" fill="none" stroke="#1D6FE8" stroke-width="2"/>
    </g>
  </g>

  <!-- Right: Capabilities & Tech Pipeline -->
  <g transform="translate(520, 100)">
    <rect width="400" height="340" rx="16" fill="url(#atCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="20" y="20" width="360" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D6FE8">ASSISTANT ENGINE ARCHITECTURE</text>

    <g transform="translate(20, 75)">
      <rect width="360" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Google Gemini API Reasoning</text>
      <text x="16" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Multi-turn context synthesis &amp; intent classification</text>

      <rect y="58" width="360" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Voice Input &amp; Speech Feedback</text>
      <text x="16" y="96" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Realtime speech-to-text recognition &amp; audio generation</text>

      <rect y="116" width="360" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Productivity Automation</text>
      <text x="16" y="154" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Automated calendar, task queuing, and clipboard actions</text>

      <rect y="174" width="360" height="58" rx="10" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="16" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Connected-Device Integration</text>
      <text x="16" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Command protocols for local endpoints &amp; smart devices</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 465)">
    <rect width="880" height="45" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4">
      Core Tech: <tspan fill="#F5F9FF">Flutter • Dart • Google Gemini API • Voice Processing • Cyber-Tech UI • Automation</tspan>
    </text>
  </g>
</svg>

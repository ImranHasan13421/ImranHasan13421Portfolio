<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="ezzeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#0B1220"/>
    </linearGradient>
    <linearGradient id="ezzeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2B"/>
      <stop offset="100%" stop-color="#0E1724"/>
    </linearGradient>
    <linearGradient id="ezzePrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1D6FE8"/>
      <stop offset="100%" stop-color="#2F2E98"/>
    </linearGradient>
    <pattern id="ezzeGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#23354D" stroke-width="0.6" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="960" height="540" fill="url(#ezzeBg)"/>
  <rect width="960" height="540" fill="url(#ezzeGrid)"/>

  <!-- Top Banner / Badge -->
  <rect x="40" y="30" width="880" height="46" rx="12" fill="#111C2B" stroke="#23354D" stroke-width="1.5"/>
  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">EZZEWASH LAUNDRY MANAGEMENT ECOSYSTEM</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">SYSTEM ARCHITECTURE MOCKUP</text>

  <!-- Component 1: Customer App Flow -->
  <g transform="translate(40, 100)">
    <rect width="200" height="340" rx="16" fill="url(#ezzeCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="16" y="16" width="168" height="28" rx="8" fill="#162438"/>
    <text x="26" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1D6FE8">01. CUSTOMER APP</text>
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#9AAEC4">End-User Booking Flow</text>

    <!-- Step Items -->
    <g transform="translate(16, 85)">
      <rect width="168" height="36" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <circle cx="16" cy="18" r="4" fill="#1D6FE8"/>
      <text x="30" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">1. Select Service &amp; Store</text>

      <rect y="44" width="168" height="36" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <circle cx="16" cy="62" r="4" fill="#1D6FE8"/>
      <text x="30" y="66" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">2. Schedule Pickup Slot</text>

      <rect y="88" width="168" height="36" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <circle cx="16" cy="106" r="4" fill="#1D6FE8"/>
      <text x="30" y="110" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">3. Quantities &amp; Promos</text>

      <rect y="132" width="168" height="36" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <circle cx="16" cy="150" r="4" fill="#1D6FE8"/>
      <text x="30" y="154" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">4. Payment &amp; Confirmation</text>

      <rect y="176" width="168" height="36" rx="8" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <circle cx="16" cy="194" r="4" fill="#60A5FA"/>
      <text x="30" y="198" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60A5FA">5. Live Status Tracking</text>
    </g>
  </g>

  <!-- Component 2: Admin Control Center -->
  <g transform="translate(265, 100)">
    <rect width="215" height="340" rx="16" fill="url(#ezzeCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="16" y="16" width="183" height="28" rx="8" fill="#162438"/>
    <text x="26" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1D6FE8">02. ADMIN CENTER</text>
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#9AAEC4">Operations &amp; Control Hub</text>

    <!-- Admin Modules -->
    <g transform="translate(16, 85)">
      <rect width="183" height="48" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5F9FF">Order Management</text>
      <text x="14" y="38" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Status dispatch, queueing, state transitions</text>

      <rect y="56" width="183" height="48" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="78" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5F9FF">Pricing &amp; Stores</text>
      <text x="14" y="94" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Dynamic service rates, branches, inventory</text>

      <rect y="112" width="183" height="48" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="134" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5F9FF">Financial Reports</text>
      <text x="14" y="150" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Payment verification &amp; operational metrics</text>

      <rect y="168" width="183" height="48" rx="8" fill="#162438" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="190" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60A5FA">Live Fleet Dispatch</text>
      <text x="14" y="206" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Rider routing &amp; delivery assignment</text>
    </g>
  </g>

  <!-- Component 3: Rider App -->
  <g transform="translate(505, 100)">
    <rect width="200" height="340" rx="16" fill="url(#ezzeCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="16" y="16" width="168" height="28" rx="8" fill="#162438"/>
    <text x="26" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1D6FE8">03. RIDER APP</text>
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#9AAEC4">Logistics &amp; Delivery Tasks</text>

    <!-- Rider Modules -->
    <g transform="translate(16, 85)">
      <rect width="168" height="44" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">Pickup Notifications</text>
      <text x="14" y="34" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Instant task allocation</text>

      <rect y="52" width="168" height="44" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">Drop-off Tasks</text>
      <text x="14" y="86" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Customer delivery updates</text>

      <rect y="104" width="168" height="44" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="124" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">Cash Collection</text>
      <text x="14" y="138" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">On-delivery reconciliation</text>

      <rect y="156" width="168" height="56" rx="8" fill="#162438" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="178" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60A5FA">Live Location</text>
      <text x="14" y="194" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Realtime rider GPS signal sync</text>
    </g>
  </g>

  <!-- Component 4: Promotional Web & Backend Core -->
  <g transform="translate(730, 100)">
    <rect width="190" height="340" rx="16" fill="url(#ezzeCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="16" y="16" width="158" height="28" rx="8" fill="#162438"/>
    <text x="24" y="34" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#1D6FE8">04. WEB &amp; CLOUD</text>
    <text x="16" y="65" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#9AAEC4">Portal &amp; Supabase Core</text>

    <!-- Cloud and Web Items -->
    <g transform="translate(16, 85)">
      <rect width="158" height="50" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="12" y="20" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">Promotional Web</text>
      <text x="12" y="35" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Order wizard &amp; chat bot</text>

      <rect y="58" width="158" height="50" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="12" y="78" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">PostgreSQL Database</text>
      <text x="12" y="93" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">Relational integrity &amp; RLS</text>

      <rect y="116" width="158" height="50" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="12" y="136" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#F5F9FF">Realtime Engine</text>
      <text x="12" y="151" font-family="system-ui, sans-serif" font-size="9" fill="#9AAEC4">WebSocket subscriptions</text>

      <rect y="174" width="158" height="42" rx="8" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="12" y="194" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#60A5FA">Edge Functions</text>
      <text x="12" y="207" font-family="system-ui, sans-serif" font-size="8.5" fill="#9AAEC4">Server-side notifications</text>
    </g>
  </g>

  <!-- Bottom Technical Legend -->
  <g transform="translate(40, 465)">
    <rect width="880" height="45" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4">
      Core Tech: <tspan fill="#F5F9FF">Flutter • Dart • BLoC • GoRouter • Supabase PostgreSQL • Realtime • Cloud Storage</tspan>
    </text>
    <text x="860" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#1D6FE8" text-anchor="end">
      Final-Year Collaborative CSE Project
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="emBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="emCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2B"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
    <linearGradient id="vinylGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A2638"/>
      <stop offset="50%" stop-color="#0E1624"/>
      <stop offset="100%" stop-color="#050A12"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#emBg)"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="880" height="46" rx="12" fill="#111C2B" stroke="#23354D" stroke-width="1.5"/>
  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">EZZEMUSIC — OFFLINE AUDIO PLAYER &amp; DYNAMIC THEMES</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">PLAYER ARCHITECTURE MOCKUP</text>

  <!-- Left: Vinyl Player Interface Visualization -->
  <g transform="translate(40, 100)">
    <rect width="450" height="340" rx="16" fill="url(#emCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="20" y="20" width="410" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5F9FF">VINYL-STYLE NOW PLAYING &amp; GLASSMORPHIC UI</text>

    <!-- Vinyl Disc Visualizer -->
    <g transform="translate(135, 75)">
      <circle cx="90" cy="90" r="85" fill="url(#vinylGrad)" stroke="#23354D" stroke-width="2"/>
      <circle cx="90" cy="90" r="70" fill="none" stroke="#23354D" stroke-width="1" stroke-dasharray="8 6"/>
      <circle cx="90" cy="90" r="55" fill="none" stroke="#1D6FE8" stroke-width="0.8" stroke-opacity="0.4"/>
      <circle cx="90" cy="90" r="40" fill="none" stroke="#23354D" stroke-width="1"/>
      <circle cx="90" cy="90" r="26" fill="#1D6FE8"/>
      <circle cx="90" cy="90" r="6" fill="#FFFFFF"/>
    </g>

    <!-- Track metadata & Scrubber -->
    <g transform="translate(30, 275)">
      <text x="0" y="16" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF">Local High-Res Audio Track</text>
      <text x="0" y="32" font-family="system-ui, sans-serif" font-size="10" fill="#9AAEC4">Dynamic Palette Extracted • Background Playback Active</text>
      <!-- Scrubber -->
      <rect y="42" width="390" height="6" rx="3" fill="#23354D"/>
      <rect y="42" width="220" height="6" rx="3" fill="#1D6FE8"/>
      <circle cx="220" cy="45" r="5" fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Right: Architecture Features -->
  <g transform="translate(510, 100)">
    <rect width="410" height="340" rx="16" fill="url(#emCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="20" y="20" width="370" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D6FE8">AUDIO ENGINE CAPABILITIES</text>

    <g transform="translate(20, 75)">
      <rect width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Local Media Storage Indexer</text>
      <text x="16" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Automatic audio scanning with ID3 metadata parsing</text>

      <rect y="58" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Background Audio Service</text>
      <text x="16" y="96" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Lock-screen notifications &amp; persistent audio session</text>

      <rect y="116" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Dynamic Color Theming</text>
      <text x="16" y="154" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Color palettes adapt in real time to album artwork</text>

      <rect y="174" width="370" height="58" rx="10" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="16" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Glassmorphic Aesthetics</text>
      <text x="16" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Translucent blurred surfaces and smooth micro-animations</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 465)">
    <rect width="880" height="45" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4">
      Core Tech: <tspan fill="#F5F9FF">Flutter • Dart • Local Storage • Background Audio • Glassmorphism • Dynamic Themes</tspan>
    </text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540">
  <defs>
    <linearGradient id="eeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050A12"/>
      <stop offset="100%" stop-color="#080F1E"/>
    </linearGradient>
    <linearGradient id="eeCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111C2B"/>
      <stop offset="100%" stop-color="#0B1320"/>
    </linearGradient>
  </defs>

  <rect width="960" height="540" fill="url(#eeBg)"/>

  <!-- Top Banner -->
  <rect x="40" y="30" width="880" height="46" rx="12" fill="#111C2B" stroke="#23354D" stroke-width="1.5"/>
  <circle cx="65" cy="53" r="6" fill="#1D6FE8"/>
  <text x="85" y="58" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F5F9FF" letter-spacing="1.5">EZZEEXPENSE — OFFLINE EXPENSE &amp; BUDGET ANALYTICS</text>
  <text x="895" y="57" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4" text-anchor="end">FINANCE ARCHITECTURE MOCKUP</text>

  <!-- Left: Visual Analytics Chart Dashboard -->
  <g transform="translate(40, 100)">
    <rect width="450" height="340" rx="16" fill="url(#eeCard)" stroke="#1D6FE8" stroke-width="1.5"/>
    <rect x="20" y="20" width="410" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F5F9FF">EXPENSE CHARTS &amp; BUDGET THRESHOLD GAUGES</text>

    <!-- Simulated Chart Gauges & Bars -->
    <g transform="translate(30, 80)">
      <!-- Left side: Category Doughnut Mockup -->
      <g transform="translate(10, 10)">
        <circle cx="70" cy="70" r="55" fill="none" stroke="#23354D" stroke-width="18"/>
        <circle cx="70" cy="70" r="55" fill="none" stroke="#1D6FE8" stroke-width="18" stroke-dasharray="140 300" stroke-linecap="round"/>
        <circle cx="70" cy="70" r="55" fill="none" stroke="#3B82F6" stroke-width="18" stroke-dasharray="80 300" stroke-dashoffset="-145" stroke-linecap="round"/>
        <text x="70" y="74" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#F5F9FF" text-anchor="middle">BUDGET</text>
      </g>

      <!-- Right side: Monthly Velocity Bar Chart -->
      <g transform="translate(180, 20)">
        <line x1="0" y1="120" x2="200" y2="120" stroke="#23354D" stroke-width="1.5"/>
        <rect x="15" y="60" width="22" height="60" rx="4" fill="#23354D"/>
        <rect x="55" y="40" width="22" height="80" rx="4" fill="#3B82F6"/>
        <rect x="95" y="25" width="22" height="95" rx="4" fill="#1D6FE8"/>
        <rect x="135" y="50" width="22" height="70" rx="4" fill="#23354D"/>
        <rect x="175" y="15" width="22" height="105" rx="4" fill="#60A5FA"/>
      </g>
    </g>

    <!-- Bottom budget summary cards -->
    <g transform="translate(20, 260)">
      <rect width="195" height="56" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#9AAEC4">Monthly Budget Status</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#60A5FA">On Track • Safe Zone</text>

      <rect x="210" width="195" height="56" rx="8" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="14" y="22" font-family="system-ui, sans-serif" font-size="10" fill="#9AAEC4">Category Velocity</text>
      <text x="14" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D6FE8">12 Categories Monitored</text>
    </g>
  </g>

  <!-- Right: Architecture Features -->
  <g transform="translate(510, 100)">
    <rect width="410" height="340" rx="16" fill="url(#eeCard)" stroke="#23354D" stroke-width="1.5"/>
    <rect x="20" y="20" width="370" height="36" rx="8" fill="#162438"/>
    <text x="36" y="42" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#1D6FE8">ANALYTICS &amp; ENGINE FEATURES</text>

    <g transform="translate(20, 75)">
      <rect width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="22" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Offline-First Transaction Logging</text>
      <text x="16" y="38" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Fast expense and income entry with zero internet dependencies</text>

      <rect y="58" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="80" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Multi-Period Analytics</text>
      <text x="16" y="96" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Weekly, monthly, and yearly historical aggregation &amp; trends</text>

      <rect y="116" width="370" height="50" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
      <text x="16" y="138" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#F5F9FF">Proactive Budget Warning Thresholds</text>
      <text x="16" y="154" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Automatic alerts when approaching user-defined limits</text>

      <rect y="174" width="370" height="58" rx="10" fill="#162438" stroke="#1D6FE8" stroke-width="1"/>
      <text x="16" y="198" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#60A5FA">Granular Category Allocations</text>
      <text x="16" y="216" font-family="system-ui, sans-serif" font-size="9.5" fill="#9AAEC4">Configurable budget ceilings for dining, utilities, travel, and more</text>
    </g>
  </g>

  <!-- Bottom Bar -->
  <g transform="translate(40, 465)">
    <rect width="880" height="45" rx="10" fill="#0B1220" stroke="#23354D" stroke-width="1"/>
    <text x="20" y="27" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#9AAEC4">
      Core Tech: <tspan fill="#F5F9FF">Flutter • Dart • Offline SQLite / Hive • FL Chart • Analytics Engine • Budget Warnings</tspan>
    </text>
  </g>
</svg>
